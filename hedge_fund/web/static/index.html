<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基金选购 · AI 对冲基金</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">
      <span class="brand-icon">基</span>
      <span class="brand-pulse"></span>
    </div>
    <div class="brand-text">
      <h1>Fund <span class="accent">Lab</span></h1>
      <p class="tagline">国内场外公募基金 · 主题筛选 · 量化信号 · LLM 合成</p>
    </div>
  </div>
  <div class="topbar-right">
    <span id="clock" class="clock"></span>
    <button id="btn-fullscreen" class="btn-icon" title="全屏" onclick="toggleFullscreen()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="conn" class="conn" title="连接状态">
      <span class="conn-dot"></span>
    </div>
  </div>
</header>

<main>
  <section id="daily-banner" class="daily-banner hidden">
    <div class="daily-inner">
      <div class="daily-badge">今日推荐</div>
      <div class="daily-info">
        <span id="daily-theme" class="daily-theme"></span>
        <span id="daily-fund" class="daily-fund"></span>
        <span id="daily-verdict" class="daily-verdict"></span>
      </div>
      <button id="daily-detail-btn" class="btn-ghost" onclick="showDailyDetail()">查看详情</button>
    </div>
  </section>

  <section id="step-theme" class="panel">
    <div class="panel-header">
      <span class="step-badge">01</span>
      <h2>选择主题</h2>
    </div>
    <div id="theme-grid" class="grid"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span class="step-badge custom">定制</span>
      <h2>指定基金分析</h2>
    </div>
    <div class="custom-input">
      <input id="fund-code-input" type="text" placeholder="输入基金代码，如 010013"
             maxlength="6" pattern="[0-9]{6}">
      <button id="btn-analyze-fund" class="primary" onclick="startSingleFund()">分析</button>
    </div>
  </section>

  <section id="step-progress" class="panel hidden">
    <div class="panel-header">
      <span class="step-badge">02</span>
      <h2>分析进度</h2>
    </div>
    <div id="status-line" class="status">
      <span class="status-dot pulse"></span>
      <span id="status-text"></span>
    </div>
    <div id="progress-list" class="progress"></div>
  </section>

  <section id="step-report" class="panel hidden">
    <div class="panel-header">
      <span class="step-badge done">03</span>
      <h2>分析报告</h2>
    </div>
    <div id="report-list" class="report"></div>
  </section>
</main>

<aside id="detail" class="detail hidden">
  <button id="detail-close" class="detail-close" title="关闭">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <div id="detail-body"></div>
</aside>
<div id="detail-backdrop" class="detail-backdrop hidden" onclick="closeDetail()"></div>

<footer class="foot">
  <span>分析仅基于公开数据 + 量化模型 + LLM 推理，不构成投资建议</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
